<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela_de_Login</title>
    <link rel="stylesheet" href="login.css">
</head>
    <body>

    <div>   
        <h1 id="titulo_login"> 
            <a id="titulo_login_link" href="http://127.0.0.1:3000/Site/Home/Main/index.html">
                MyWatchList
            </a>
        </h1>
    </div>

    <div id="login" class="">
       <form id="form-login">
            <ul>
            <li>
                <p>Email</p>
                <input id="login-email" type="email" placeholder="Insira o seu Email">
            </li>
            
            <li>
                <p>Senha</p>
                <input id="login-senha" type="password" placeholder="Insra a sua senha">
            </li>

            <li>
                <button type="submit" id="botao_confirmar">Confirmar</button>            </li>
            </ul>
       </form>
    
    <div id="msg-login" style="display: none;"></div>
        
       <div id="cadastre">
            <p>Não tem uma conta?</p>
            <a id="link_cadastro" href="http://127.0.0.1:3000/Site/Home/Cadastro/tela_de_cadastro.html">Cadastre-se</a>
        </div>

    </div>
    <script src="login.js"></script>
    </body>
</html>
