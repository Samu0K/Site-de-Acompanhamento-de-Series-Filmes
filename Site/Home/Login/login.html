<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela_de_Login</title>
    <link rel="stylesheet" href="login.css">
</head>
    <body>

    <div>   
        <h1 id="titulo_login">
            MyWatchList
    </div>

    <div id="login" class="">
       <form id="form-login">
            <li>
                <p>Email</p>
                <input id="email" type="email" placeholder="Insira o seu Email">
            </li>
            
            <li>
                <p>Senha</p>
                <input id="senha" type="password" placeholder="Insra a sua senha">
            </li>

            <li>
                <button type="submit" id="botao_confirmar">Confirmar</button>            </li>
       </form>

       <div id="cadastre">
            <p>Não tem uma conta?</p>
            <button id="link_cadastro" type="button" onclick="window.location.href='/Home/Cadastro/tela_de_cadastro.html'">Cadastre-se</button>
        </div>

    </body>
</html>
